name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          echo "=== files in repo ==="
          find . -not -path './.git/*' -type f | head -60
          F=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then echo "ERROR: settings.gradle not found anywhere"; exit 1; fi
          DIR=$(dirname "$F")
          echo "Building in $DIR"
          cd "$DIR"
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RentTracker-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
